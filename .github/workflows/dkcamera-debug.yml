name: DKCaMera Android Debug Build

on:
  push:
    branches: [dkcamera-branding, dkcamera-video-zoom-ai-fixes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DKCaMera APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install project NDK and CMake versions
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile and package APK
        run: ./gradlew :app:assembleDefaultDebug --no-daemon --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DKCaMera-debug-apk
          path: app/build/outputs/apk/default/debug/*.apk
          if-no-files-found: error
          retention-days: 14
